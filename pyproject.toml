[project]
name = "vbr-write-mcp"
version = "0.1.0"
description = "MCP server with the write and administration operations of the Veeam Backup & Replication REST API, with server-side confirmation, dry-run and audit log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.12",
]

[project.scripts]
vbr-write-mcp = "vbr_write_mcp:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.107",
]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-httpx>=0.35"]
demo = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/vbr_write_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/vbr_write_mcp/data/vbr_api_1.3-rev2.json.gz" = "vbr_write_mcp/data/vbr_api_1.3-rev2.json.gz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = ["vbr_write_mcp", "conftest"]
